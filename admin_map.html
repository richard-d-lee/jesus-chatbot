<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jesus Chatbot - User Map</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1600px;
            margin: 0 auto;
        }

        .header {
            background: white;
            border-radius: 12px;
            padding: 20px 30px;
            margin-bottom: 20px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }

        .header h1 {
            color: #333;
            font-size: 28px;
        }

        .header-actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .btn-small {
            padding: 10px 20px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            text-decoration: none;
        }

        .btn-small:hover {
            background: #5568d3;
            transform: translateY(-2px);
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }

        .stat-card {
            background: white;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            text-align: center;
        }

        .stat-card h3 {
            color: #666;
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 10px;
        }

        .stat-card .value {
            color: #667eea;
            font-size: 32px;
            font-weight: 700;
        }

        .map-container {
            background: white;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            margin-bottom: 20px;
        }

        .map-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .map-header h2 {
            color: #333;
            font-size: 20px;
        }

        .auto-refresh {
            display: flex;
            align-items: center;
            gap: 10px;
            color: #666;
            font-size: 14px;
        }

        .auto-refresh input {
            width: 18px;
            height: 18px;
            cursor: pointer;
        }

        #map {
            height: 600px;
            border-radius: 8px;
            z-index: 1;
        }

        .country-list {
            background: white;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
        }

        .country-list h2 {
            color: #333;
            font-size: 20px;
            margin-bottom: 15px;
        }

        .country-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 10px;
        }

        .country-item {
            background: #f8f9fa;
            border-left: 4px solid #667eea;
            border-radius: 6px;
            padding: 12px 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .country-name {
            color: #333;
            font-weight: 500;
        }

        .country-count {
            background: #667eea;
            color: white;
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 600;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #666;
        }

        .spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .pulse-dot {
            width: 12px;
            height: 12px;
            background: #667eea;
            border-radius: 50%;
            display: inline-block;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(102, 126, 234, 0.7); }
            70% { box-shadow: 0 0 0 10px rgba(102, 126, 234, 0); }
            100% { box-shadow: 0 0 0 0 rgba(102, 126, 234, 0); }
        }

        .leaflet-popup-content {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        .popup-content {
            text-align: center;
            min-width: 150px;
        }

        .popup-content h4 {
            color: #333;
            margin-bottom: 5px;
        }

        .popup-content p {
            color: #666;
            font-size: 13px;
            margin: 3px 0;
        }

        .popup-content .visits {
            background: #667eea;
            color: white;
            padding: 3px 10px;
            border-radius: 10px;
            font-size: 12px;
            display: inline-block;
            margin-top: 5px;
        }

        @media (max-width: 768px) {
            .header {
                flex-direction: column;
                text-align: center;
            }

            #map {
                height: 400px;
            }

            .stats-grid {
                grid-template-columns: 1fr 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>World User Map</h1>
            <div class="header-actions">
                <a href="admin_dashboard.html" class="btn-small">Chat Logs</a>
                <button class="btn-small" onclick="loadData()">Refresh</button>
            </div>
        </div>

        <div id="statsContainer" class="stats-grid">
            <div class="loading">
                <div class="spinner"></div>
            </div>
        </div>

        <div class="map-container">
            <div class="map-header">
                <h2>User Locations</h2>
                <div class="auto-refresh">
                    <input type="checkbox" id="autoRefresh" checked>
                    <label for="autoRefresh">Auto-refresh every 30s</label>
                    <span class="pulse-dot"></span>
                </div>
            </div>
            <div id="map"></div>
        </div>

        <div id="countryList" class="country-list">
            <h2>Users by Country</h2>
            <div id="countryGrid" class="country-grid">
                <div class="loading">
                    <div class="spinner"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const BASE_URL = 'https://www.jesus.express';
        // Admin API key handling: prompted once, remembered in localStorage.
        let ADMIN_KEY = localStorage.getItem('adminApiKey') || '';
        async function adminFetch(url, options = {}) {
            if (!ADMIN_KEY) {
                ADMIN_KEY = window.prompt('Enter your admin API key:') || '';
                if (ADMIN_KEY) localStorage.setItem('adminApiKey', ADMIN_KEY);
            }
            options.headers = Object.assign({}, options.headers, { 'X-Admin-Key': ADMIN_KEY });
            const response = await fetch(url, options);
            if (response.status === 401 || response.status === 503) {
                localStorage.removeItem('adminApiKey');
                ADMIN_KEY = '';
                alert(response.status === 401
                    ? 'Invalid admin key. Reload the page and try again.'
                    : 'ADMIN_API_KEY is not configured on the server yet.');
                throw new Error('Admin auth failed');
            }
            return response;
        }

        let map = null;
        let markers = [];
        let refreshInterval = null;

        // Initialize on page load
        document.addEventListener('DOMContentLoaded', function() {
            initMap();
            loadData();
            setupAutoRefresh();
        });

        function initMap() {
            if (map) return;

            map = L.map('map').setView([20, 0], 2);

            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
            }).addTo(map);
        }

        function setupAutoRefresh() {
            const checkbox = document.getElementById('autoRefresh');

            function updateRefresh() {
                if (refreshInterval) {
                    clearInterval(refreshInterval);
                }
                if (checkbox.checked) {
                    refreshInterval = setInterval(loadData, 30000);
                }
            }

            checkbox.addEventListener('change', updateRefresh);
            updateRefresh();
        }

        async function loadData() {
            await Promise.all([loadStats(), loadLocations()]);
        }

        async function loadStats() {
            const container = document.getElementById('statsContainer');

            try {
                const response = await adminFetch(`${BASE_URL}/api/admin/locations/stats`);
                const data = await response.json();

                if (data.success) {
                    const stats = data.stats;
                    const countryCount = Object.keys(stats.by_country || {}).length;

                    container.innerHTML = `
                        <div class="stat-card">
                            <h3>Unique Locations</h3>
                            <div class="value">${stats.total_unique_locations}</div>
                        </div>
                        <div class="stat-card">
                            <h3>Total Visits</h3>
                            <div class="value">${stats.total_visits}</div>
                        </div>
                        <div class="stat-card">
                            <h3>Countries</h3>
                            <div class="value">${countryCount}</div>
                        </div>
                    `;

                    // Update country list
                    updateCountryList(stats.by_country || {});
                }
            } catch (error) {
                container.innerHTML = `<div class="error show">Error loading statistics: ${error.message}</div>`;
            }
        }

        function updateCountryList(countries) {
            const grid = document.getElementById('countryGrid');
            const sorted = Object.entries(countries).sort((a, b) => b[1] - a[1]);

            if (sorted.length === 0) {
                grid.innerHTML = '<p style="color: #999;">No location data yet. Users will appear as they use the chatbot.</p>';
                return;
            }

            grid.innerHTML = sorted.map(([country, count]) => `
                <div class="country-item">
                    <span class="country-name">${country}</span>
                    <span class="country-count">${count}</span>
                </div>
            `).join('');
        }

        async function loadLocations() {
            try {
                const response = await adminFetch(`${BASE_URL}/api/admin/locations`);
                const data = await response.json();

                if (data.success) {
                    updateMarkers(data.locations);
                }
            } catch (error) {
                console.error('Error loading locations:', error);
            }
        }

        function updateMarkers(locations) {
            // Clear existing markers
            markers.forEach(marker => map.removeLayer(marker));
            markers = [];

            // Add new markers
            locations.forEach(loc => {
                if (loc.latitude && loc.longitude) {
                    const marker = L.circleMarker([loc.latitude, loc.longitude], {
                        radius: Math.min(8 + Math.log(loc.visit_count) * 3, 20),
                        fillColor: '#667eea',
                        color: '#5568d3',
                        weight: 2,
                        opacity: 1,
                        fillOpacity: 0.7
                    }).addTo(map);

                    const popupContent = `
                        <div class="popup-content">
                            <h4>${loc.city || 'Unknown'}</h4>
                            <p>${loc.region || ''}</p>
                            <p><strong>${loc.country || 'Unknown'}</strong></p>
                            <span class="visits">${loc.visit_count} visit${loc.visit_count !== 1 ? 's' : ''}</span>
                            <p style="font-size: 11px; color: #999; margin-top: 8px;">
                                First: ${formatDate(loc.first_seen)}<br>
                                Last: ${formatDate(loc.last_seen)}
                            </p>
                        </div>
                    `;

                    marker.bindPopup(popupContent);
                    markers.push(marker);
                }
            });
        }

        function formatDate(isoString) {
            if (!isoString) return 'N/A';
            const date = new Date(isoString);
            return date.toLocaleDateString() + ' ' + date.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
        }
    </script>
</body>
</html>
